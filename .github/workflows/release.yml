name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "python/**"
      - "main.go"
      - "go.mod"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 0.1.0)"
        required: true
        default: "0.1.0"

jobs:
  prepare:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create tag when needed
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

  build-go:
    name: Go ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            buildmode: ""
          - goos: linux
            goarch: arm64
            ext: ""
            buildmode: ""
          - goos: android
            goarch: amd64
            ext: ""
            buildmode: "-buildmode=pie"
          - goos: android
            goarch: arm64
            ext: ""
            buildmode: "-buildmode=pie"
          - goos: windows
            goarch: amd64
            ext: ".exe"
            buildmode: ""
          - goos: windows
            goarch: arm64
            ext: ".exe"
            buildmode: ""
          - goos: darwin
            goarch: amd64
            ext: ""
            buildmode: ""
          - goos: darwin
            goarch: arm64
            ext: ""
            buildmode: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Resolve dependencies
        run: go mod tidy
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          BUILDMODE: ${{ matrix.buildmode }}
        run: |
          mkdir -p dist
          go build ${BUILDMODE} -trimpath -ldflags="-s -w" -o "dist/kyozitu-news-bot-${GOOS}-${GOARCH}${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  github-release:
    name: GitHub Release
    needs: [prepare, build-go]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: go-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum kyozitu-news-bot-* > checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
          fi

  build-python:
    name: Build PyPI package
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set package version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["VERSION"]
          p = pathlib.Path("pyproject.toml")
          s = p.read_text()
          s = re.sub(r'^version = ".*"$', f'version = "{version}"', s, flags=re.M)
          p.write_text(s)
          p = pathlib.Path("python/kyozitu_news_bot/__init__.py")
          s = p.read_text()
          s = re.sub(r'^__version__ = ".*"$', f'__version__ = "{version}"', s, flags=re.M)
          p.write_text(s)
          PY
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  pypi:
    name: Publish to PyPI
    needs: [prepare, github-release, build-python]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
