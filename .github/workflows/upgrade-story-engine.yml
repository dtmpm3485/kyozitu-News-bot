name: Upgrade story engine

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-story-engine.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch news builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.go')
          s = p.read_text()
          old1 = 'Content: buildNews(u.UserID)'
          new1 = 'Content: buildRichNews(i.GuildID, u.UserID)'
          old2 = 'Content: buildNews(item.User.UserID)'
          new2 = 'Content: buildRichNews(item.GuildID, item.User.UserID)'
          if old1 not in s or old2 not in s:
              raise SystemExit('expected buildNews call not found')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
          gofmt -w main.go
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.go
          git commit -m "Switch to rich story news engine"
          git push
